<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · gpct</title>
  <meta name="description" content="{{ site.description | escape }}">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; line-height: 1.65; color: #18303b; background: #f5f8fa; }
    body { margin: 0; } header, main, footer { max-width: 64rem; margin: auto; padding: 1.5rem; }
    header { border-bottom: 2px solid #167264; } header strong { font-size: 1.6rem; }
    nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; margin-top: 0.6rem; }
    a { color: #075d71; text-underline-offset: 0.2em; } a:focus-visible { outline: 3px solid #c46219; }
    main { background: white; min-height: 55vh; overflow-wrap: anywhere; }
    h1, h2, h3 { line-height: 1.25; color: #153b44; } h1 { font-size: 2.15rem; }
    table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { text-align: left; padding: 0.65rem; border-bottom: 1px solid #d5e0e5; vertical-align: top; }
    th { background: #e9f3f1; } code { background: #eef2f5; padding: 0.15rem 0.3rem; }
    pre { background: #eef2f5; padding: 1rem; overflow-x: auto; } pre code { padding: 0; }
    blockquote { border-left: 4px solid #167264; margin-left: 0; padding-left: 1rem; }
    footer { font-size: 0.9rem; color: #405966; }
  </style>
</head>
<body>
  <header><strong><a href="{{ '/' | relative_url }}">gpct</a></strong>
    <nav aria-label="Main navigation">
      <a href="{{ '/datasets.html' | relative_url }}">Datasets</a>
      <a href="{{ '/benchmarks.html' | relative_url }}">Benchmarks</a>
      <a href="{{ '/methods.html' | relative_url }}">Methods</a>
      <a href="{{ '/protocol.html' | relative_url }}">Protocol</a>
      <a href="{{ '/results.html' | relative_url }}">Results</a>
    </nav>
  </header>
  <main id="content">{{ content }}</main>
  <footer>Genomic prediction benchmark collection. Only reviewed aggregate summaries belong on this site.</footer>
</body>
</html>
