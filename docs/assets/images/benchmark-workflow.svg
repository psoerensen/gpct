<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
  <title id="title">gpct: from genomic data to reproducible comparisons</title>
  <desc id="description">Cattle and maize genotypes and traits pass through identical saved five-fold partitions, training-only preparation, existing R package fitting and held-out evaluation. Individual records stay local. Only reviewed aggregate summaries are published. Both pilots are planned and no prediction results are available.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697582"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #24292e; }
      .heading { font-size: 22px; font-weight: 600; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .muted { fill: #586069; }
      .blue { fill: #0366d6; }
      .line { fill: none; stroke: #697582; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="620" fill="#fff"/>
  <text x="24" y="38" font-size="28" font-weight="600">From genomic data to reproducible comparisons</text>
  <text x="24" y="68" class="body muted">Document the inputs. Share the splits. Evaluate held-out predictions.</text>
  <rect x="24" y="102" width="244" height="300" rx="8" fill="#f6f8fa" stroke="#d1d5da"/>
  <rect x="300" y="102" width="244" height="300" rx="8" fill="#f1f7ff" stroke="#b8d5f6"/>
  <rect x="576" y="102" width="244" height="300" rx="8" fill="#f0f8f4" stroke="#b8d9c5"/>
  <rect x="852" y="102" width="244" height="300" rx="8" fill="#faf6ed" stroke="#e1d5b6"/>
  <text x="44" y="139" class="heading">Source datasets</text>
  <text x="44" y="169" class="body muted">Genotypes + traits</text>
  <rect x="44" y="193" width="204" height="48" rx="5" fill="#fff" stroke="#d1d5da"/>
  <text x="58" y="223" class="body">Cattle · mkg</text>
  <rect x="44" y="252" width="204" height="48" rx="5" fill="#fff" stroke="#d1d5da"/>
  <text x="58" y="282" class="body">Maize · DTT</text>
  <text x="44" y="333" class="small">Record provenance,</text>
  <text x="44" y="357" class="small">source positions and rights.</text>
  <text x="44" y="383" class="small muted">Initial pilots: 512 markers</text>
  <path d="M274 251 H292" class="line"/>
  <text x="320" y="139" class="heading">Shared validation</text>
  <text x="320" y="169" class="body muted">Five folds · seed 4401</text>
  <g transform="translate(320 201)">
    <rect width="34" height="40" rx="3" fill="#0366d6"/>
    <rect x="42" width="34" height="40" rx="3" fill="#c8d9ed"/>
    <rect x="84" width="34" height="40" rx="3" fill="#c8d9ed"/>
    <rect x="126" width="34" height="40" rx="3" fill="#c8d9ed"/>
    <rect x="168" width="34" height="40" rx="3" fill="#c8d9ed"/>
    <text x="17" y="26" text-anchor="middle" font-size="17" style="fill:white">1</text>
    <text x="59" y="26" text-anchor="middle" font-size="17">2</text>
    <text x="101" y="26" text-anchor="middle" font-size="17">3</text>
    <text x="143" y="26" text-anchor="middle" font-size="17">4</text>
    <text x="185" y="26" text-anchor="middle" font-size="17">5</text>
  </g>
  <text x="320" y="270" class="small blue">Hold out one fold; rotate.</text>
  <text x="320" y="309" class="small">Save identical partitions</text>
  <text x="320" y="333" class="small">for every method.</text>
  <text x="320" y="365" class="small muted">Test outcomes are excluded</text>
  <text x="320" y="387" class="small muted">from preparation and fitting.</text>
  <path d="M550 251 H568" class="line"/>
  <text x="596" y="139" class="heading">Existing R packages</text>
  <text x="596" y="169" class="body muted">Fit, then predict</text>
  <text x="596" y="211" class="body" font-weight="600">rrBLUP baseline</text>
  <text x="596" y="241" class="body" font-weight="600">gbayes predictors</text>
  <path d="M596 264 H800" stroke="#c9dfd1"/>
  <text x="596" y="297" class="small">Learn imputation and scales</text>
  <text x="596" y="321" class="small">from training samples only.</text>
  <text x="596" y="359" class="small muted">Use frozen transformations</text>
  <text x="596" y="383" class="small muted">on held-out genotypes.</text>
  <path d="M826 251 H844" class="line"/>
  <text x="872" y="139" class="heading">Compare predictions</text>
  <text x="872" y="169" class="body muted">Score held-out samples</text>
  <text x="872" y="211" class="body">Predictive ability</text>
  <text x="872" y="242" class="body">RMSE + predictive R²</text>
  <text x="872" y="273" class="body">Calibration</text>
  <path d="M872 292 H1076" stroke="#e1d5b6"/>
  <text x="872" y="322" class="small">Retain timings, settings,</text>
  <text x="872" y="346" class="small">versions and diagnostics.</text>
  <text x="872" y="383" class="small muted">Report failures explicitly.</text>
  <path d="M24 433 H1096" stroke="#e1e4e8"/>
  <text x="24" y="468" class="heading">Keep the comparison reproducible</text>
  <text x="24" y="500" class="body">Local records</text>
  <text x="24" y="527" class="small muted">Individual data, fold membership and predictions</text>
  <text x="610" y="500" class="body">Public pages</text>
  <text x="610" y="527" class="small muted">Recipes + reviewed aggregate tables and figures</text>
  <rect x="24" y="558" width="1072" height="42" rx="5" fill="#f6f8fa"/>
  <text x="40" y="585" class="small">Current status: both pilots are planned. No benchmark prediction results are available yet.</text>
</svg>
